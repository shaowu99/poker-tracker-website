<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>托恩扑克数据追踪器 - 玩家分析</title>
    <!-- Tailwind CSS 简化样式 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠️</text></svg>">
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 min-h-screen text-gray-100">
    <div class="container mx-auto px-4 py-6 max-w-4xl">
        <!-- 页头 -->
        <header class="text-center mb-8">
            <div class="flex items-center justify-center mb-4 flex-col">
                <div class="text-4xl sm:text-5xl mr-0 mb-2">♠️♥️♣️♦️</div>
                <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-purple-500 to-blue-500 bg-clip-text text-transparent">
                    托恩扑克数据追踪器
                </h1>
            </div>
            <p class="text-gray-400 text-base sm:text-lg">托恩扑克玩家数据分析平台</p>
            <div class="mt-4 flex justify-center">
                <a href="leaderboard.html" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors text-sm sm:text-base">查看排行榜</a>
            </div>
        </header>

        <!-- 搜索卡片 -->
        <div class="bg-gray-800 rounded-2xl shadow-2xl p-6 sm:p-8 mb-6 sm:mb-8 border border-gray-700">
            <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-6 text-center">查询玩家数据</h2>
            
            <div class="mb-6 sm:mb-8">
                <label class="block text-gray-400 mb-2 sm:mb-3 text-base sm:text-lg">输入玩家用户名</label>
                <div class="relative">
                    <input 
                        type="text" 
                        id="playerSearch" 
                        placeholder="例如：PhilIvey, DanielNegreanu"
                        class="w-full px-4 py-3 sm:px-6 sm:py-4 text-base sm:text-lg bg-gray-900 border-2 border-gray-700 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-all duration-300 outline-none"
                        autocomplete="off"
                    >
                    <div class="absolute right-2 sm:right-3 top-2 sm:top-3">
                        <span class="text-gray-500 text-sm">⏎</span>
                    </div>
                </div>
                <p class="text-gray-500 text-xs sm:text-sm mt-1 sm:mt-2">支持部分匹配，输入用户名的一部分即可</p>
            </div>

            <!-- 热门玩家（从缓存或最近查询中显示） -->
            <div id="recentPlayers" class="mb-4 sm:mb-6 hidden">
                <h3 class="text-gray-400 mb-2 sm:mb-3 text-sm sm:text-base">最近查询</h3>
                <div class="flex flex-wrap gap-2 sm:gap-3" id="recentPlayersList">
                    <!-- 通过JS动态填充 -->
                </div>
            </div>

            <!-- 搜索按钮 -->
            <div class="text-center">
                <button 
                    id="searchButton"
                    class="px-6 py-3 sm:px-8 sm:py-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold text-base sm:text-lg rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl active:scale-95 w-full sm:w-auto"
                >
                    <span class="flex items-center justify-center">
                        <svg class="w-4 h-4 sm:w-5 sm:h-5 mr-1 sm:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        分析玩家数据
                    </span>
                </button>
            </div>
        </div>

        <!-- 系统状态 -->
        <div class="grid grid-cols-1 gap-4 sm:gap-6 mb-8 sm:mb-12">
            <div class="bg-gray-800 p-4 sm:p-6 rounded-xl border border-gray-700">
                <div class="flex items-center">
                    <div class="p-2 sm:p-3 bg-blue-900 rounded-lg mr-3 sm:mr-4">
                        <span class="text-xl sm:text-2xl">📊</span>
                    </div>
                    <div>
                        <h3 class="font-bold text-base sm:text-lg" id="totalHands">--</h3>
                        <p class="text-gray-400 text-xs sm:text-sm">总手牌数</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-gray-800 p-4 sm:p-6 rounded-xl border border-gray-700">
                <div class="flex items-center">
                    <div class="p-2 sm:p-3 bg-green-900 rounded-lg mr-3 sm:mr-4">
                        <span class="text-xl sm:text-2xl">👤</span>
                    </div>
                    <div>
                        <h3 class="font-bold text-base sm:text-lg" id="totalPlayers">--</h3>
                        <p class="text-gray-400 text-xs sm:text-sm">玩家总数</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 使用说明 -->
        <div class="bg-gray-800 rounded-2xl p-4 sm:p-8 border border-gray-700">
            <h3 class="text-lg sm:text-xl font-bold mb-3 sm:mb-4">如何使用</h3>
            <div class="grid grid-cols-1 gap-4 sm:gap-6">
                <div class="text-center">
                    <div class="text-2xl sm:text-3xl mb-2 sm:mb-3">1</div>
                    <h4 class="font-bold mb-1 sm:mb-2 text-sm sm:text-base">输入玩家名</h4>
                    <p class="text-gray-400 text-xs sm:text-sm">输入你想分析的玩家用户名</p>
                </div>
                <div class="text-center">
                    <div class="text-2xl sm:text-3xl mb-2 sm:mb-3">2</div>
                    <h4 class="font-bold mb-1 sm:mb-2 text-sm sm:text-base">查看详细数据</h4>
                    <p class="text-gray-400 text-xs sm:text-sm">查看VPIP、PFR、3bet等专业数据</p>
                </div>
                <div class="text-center">
                    <div class="text-2xl sm:text-3xl mb-2 sm:mb-3">3</div>
                    <h4 class="font-bold mb-1 sm:mb-2 text-sm sm:text-base">深入分析</h4>
                    <p class="text-gray-400 text-xs sm:text-sm">按位置、牌桌、时间筛选分析</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <p class="text-xl">加载数据中...</p>
            <p class="text-gray-400 text-sm mt-2" id="loadingMessage">正在查询玩家信息</p>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="lib/supabase.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/cache-manager.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // 页面加载时显示系统统计
        document.addEventListener('DOMContentLoaded', async () => {
            // 确保稍后执行，给库一些时间加载
            setTimeout(async () => {
                await updateSystemStats();
                loadRecentPlayers();
                
                // 搜索功能
                document.getElementById('searchButton')?.addEventListener('click', searchPlayer);
                document.getElementById('playerSearch')?.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') searchPlayer();
                });
                
                // 自动聚焦搜索框
                document.getElementById('playerSearch')?.focus();
            }, 100); // 延迟100毫秒执行
        });
        
        async function searchPlayer() {
            const playerName = document.getElementById('playerSearch').value.trim();
            if (!playerName) {
                alert('请输入玩家用户名');
                return;
            }
            
            // 保存到最近查询
            saveToRecentPlayers(playerName);
            
            // 跳转到玩家详情页
            window.location.href = `player.html?player=${encodeURIComponent(playerName)}`;
        }
    </script>
</body>
</html>
