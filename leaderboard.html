<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家排行榜 - 扑克数据追踪器</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠️</text></svg>">
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 min-h-screen text-gray-100">
    <!-- 导航栏 -->
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 sm:py-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 sm:gap-0">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center hover:opacity-80 transition-opacity">
                        <span class="text-xl sm:text-2xl mr-2">♠️</span>
                        <span class="font-bold text-lg sm:text-xl">扑克数据追踪器</span>
                    </a>
                </div>
                <a 
                    href="index.html"
                    class="px-3 py-2 sm:px-4 sm:py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors text-xs sm:text-sm"
                >
                    <span class="hidden sm:inline">返回首页</span>
                    <span class="sm:hidden">返回</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="container mx-auto px-4 py-6 sm:py-8">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8 text-center">玩家排行榜</h1>
            
            <!-- 桌子选择和查询面板 -->
            <div class="bg-gray-800 rounded-2xl shadow-2xl p-4 sm:p-8 mb-6 sm:mb-8 border border-gray-700">
                <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-6">选择牌桌查询获胜排行</h2>
                
                <div class="flex flex-col gap-4">
                    <div>
                        <label class="block text-gray-400 mb-2 sm:mb-3 text-sm sm:text-base">选择牌桌</label>
                        <select 
                            id="tableSelect"
                            class="w-full px-3 py-2 sm:px-4 sm:py-3 text-base bg-gray-900 border-2 border-gray-700 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-all duration-300 outline-none"
                        >
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    
                    <div>
                        <button 
                            id="queryButton"
                            class="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold text-base sm:text-lg rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl active:scale-95"
                            onclick="queryLeaderboard()"
                        >
                            查询排行榜
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 排行榜结果 -->
            <div id="leaderboardContainer" class="hidden">
                <div class="bg-gray-800 rounded-2xl p-4 sm:p-6 border border-gray-700 mb-6 sm:mb-8">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 sm:mb-6 gap-2">
                        <h3 class="text-xl sm:text-2xl font-bold" id="tableTitle">牌桌排行榜</h3>
                        <span class="text-gray-400 text-sm" id="resultCount">共 <span id="playerCount">0</span> 位玩家</span>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full min-w-full">
                            <thead>
                                <tr class="text-left text-gray-400 border-b border-gray-700">
                                    <th class="pb-3 px-2 sm:px-4">#</th>
                                    <th class="pb-3 px-2 sm:px-4">玩家名</th>
                                    <th class="pb-3 px-2 sm:px-4">获胜</th>
                                    <th class="pb-3 px-2 sm:px-4">参与</th>
                                    <th class="pb-3 px-2 sm:px-4">胜率</th>
                                    <th class="pb-3 px-2 sm:px-4">盈利(BB)</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboardTableBody">
                                <!-- 排行榜数据将通过JS动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <p class="text-xl">加载数据中...</p>
            <p class="text-gray-400 text-sm mt-2" id="loadingMessage">正在查询排行榜信息</p>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="lib/supabase.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/cache-manager.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // 显示/隐藏加载状态
        function showLoading(message = '加载中...') {
            const loadingMessage = document.getElementById('loadingMessage');
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingMessage) loadingMessage.textContent = message;
            if (loadingOverlay) loadingOverlay.classList.remove('hidden');
        }

        function hideLoading() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) loadingOverlay.classList.add('hidden');
        }

        // 页面加载时获取牌桌列表
        document.addEventListener('DOMContentLoaded', async () => {
            await loadTableList();
        });

        // 加载牌桌列表
        async function loadTableList() {
            try {
                showLoading('加载牌桌列表...');
                
                // 获取DOM元素
                const tableSelect = document.getElementById('tableSelect');
                
                // 确保Supabase客户端已初始化
                let attempts = 0;
                const maxAttempts = 50;
                while ((!window.supabaseClient || typeof window.supabaseClient.getTableList !== 'function') && attempts < maxAttempts) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }
                
                if (!window.supabaseClient || typeof window.supabaseClient.getTableList !== 'function') {
                    throw new Error('Supabase客户端未能初始化或getTableList函数不可用');
                }
                
                const tables = await window.supabaseClient.getTableList();
                
                // 清空选择框并添加选项
                tableSelect.innerHTML = '<option value="">请选择牌桌</option>';
                
                if (tables && tables.length > 0) {
                    tables.forEach(table => {
                        const option = document.createElement('option');
                        option.value = table.id;
                        option.textContent = `${table.table_name} (${table.blinds})`;
                        tableSelect.appendChild(option);
                    });
                } else {
                    const option = document.createElement('option');
                    option.textContent = '暂无牌桌数据';
                    tableSelect.appendChild(option);
                }
                
            } catch (error) {
                console.error('加载牌桌列表失败:', error);
                const tableSelect = document.getElementById('tableSelect');
                tableSelect.innerHTML = '<option value="">加载失败</option>';
            } finally {
                hideLoading();
            }
        }

        // 查询排行榜
        async function queryLeaderboard() {
            const tableSelect = document.getElementById('tableSelect');
            const selectedTableId = tableSelect.value;
            
            if (!selectedTableId) {
                alert('请选择一个牌桌');
                return;
            }

            try {
                showLoading('查询排行榜...');
                
                // 确保Supabase客户端已初始化
                let attempts = 0;
                const maxAttempts = 50;
                while ((!window.supabaseClient || typeof window.supabaseClient.ensureSupabase !== 'function') && attempts < maxAttempts) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }
                
                if (!window.supabaseClient || typeof window.supabaseClient.ensureSupabase !== 'function') {
                    throw new Error('Supabase客户端未能初始化');
                }
                
                const client = await window.supabaseClient.ensureSupabase();
                
                // 查询选择的牌桌信息
                const { data: tableInfo, error: tableError } = await client
                    .from('poker_tables')
                    .select('table_name, blinds')
                    .eq('id', selectedTableId)
                    .single();
                
                if (tableError) throw tableError;
                
                const tableTitle = document.getElementById('tableTitle');
                tableTitle.textContent = `${tableInfo.table_name} (${tableInfo.blinds}) 排行榜`;
                
                // 首先获取该牌桌的所有游戏ID
                const { data: gameIds, error: gamesError } = await client
                    .from('games')
                    .select('id')
                    .eq('table_id', selectedTableId);
                
                if (gamesError) throw gamesError;
                
                if (!gameIds || gameIds.length === 0) {
                    // 如果没有游戏数据，显示空排行榜
                    renderLeaderboard([]);
                    const playerCount = document.getElementById('playerCount');
                    playerCount.textContent = '0';
                    const leaderboardContainer = document.getElementById('leaderboardContainer');
                    leaderboardContainer.classList.remove('hidden');
                    return;
                }
                
                // 获取游戏ID列表
                const gameIdsList = gameIds.map(game => game.id);
                
                // 查询相关玩家位置数据
                const { data: playerStats, error: statsError } = await client
                    .from('player_positions')
                    .select(`
                        player_id,
                        is_winner,
                        net_result,
                        players (username)
                    `)
                    .in('game_id', gameIdsList);
                
                if (statsError) throw statsError;
                
                // 处理数据并生成排行榜
                const leaderboard = processLeaderboardData(playerStats);
                
                // 渲染排行榜
                renderLeaderboard(leaderboard);
                
                // 更新玩家数量
                const playerCount = document.getElementById('playerCount');
                playerCount.textContent = leaderboard.length;
                
                // 显示排行榜容器
                const leaderboardContainer = document.getElementById('leaderboardContainer');
                leaderboardContainer.classList.remove('hidden');
                
            } catch (error) {
                console.error('查询排行榜失败:', error);
                alert(`查询失败: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        // 处理排行榜数据
        function processLeaderboardData(playerStats) {
            const playerMap = new Map();
            
            if (playerStats && playerStats.length > 0) {
                playerStats.forEach(stat => {
                    const playerId = stat.player_id;
                    const playerName = stat.players?.username || '未知玩家';
                    
                    if (!playerMap.has(playerId)) {
                        playerMap.set(playerId, {
                            playerId,
                            playerName,
                            wins: 0,
                            totalHands: 0,
                            totalProfit: 0
                        });
                    }
                    
                    const playerData = playerMap.get(playerId);
                    playerData.totalHands++;
                    if (stat.is_winner) playerData.wins++;
                    playerData.totalProfit += stat.net_result || 0;
                });
            }
            
            // 转换为数组并排序（按总盈利降序排列）
            let leaderboard = Array.from(playerMap.values());
            leaderboard.sort((a, b) => {
                // 按总盈利降序排列
                return b.totalProfit - a.totalProfit;
            });
            
            // 添加排名
            leaderboard.forEach((player, index) => {
                player.rank = index + 1;
                player.winRate = player.totalHands > 0 ? ((player.wins / player.totalHands) * 100).toFixed(1) : '0.0';
            });
            
            return leaderboard;
        }

        // 渲染排行榜
        function renderLeaderboard(leaderboard) {
            const leaderboardTableBody = document.getElementById('leaderboardTableBody');
            
            // 清空现有数据
            leaderboardTableBody.innerHTML = '';
            
            if (leaderboard.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="6" class="py-6 px-4 text-center text-gray-500">暂无数据</td>
                `;
                leaderboardTableBody.appendChild(row);
                return;
            }
            
            leaderboard.forEach(player => {
                const row = document.createElement('tr');
                row.className = 'border-b border-gray-700 hover:bg-gray-750 transition-colors';
                
                row.innerHTML = `
                    <td class="py-4 px-4 font-bold">${player.rank}</td>
                    <td class="py-4 px-4 font-medium">
                        <a href="https://shaowu99.github.io/poker-tracker-website/player.html?player=${encodeURIComponent(player.playerName)}"
                           class="text-blue-400 hover:text-blue-300 hover:underline transition-colors"
                           target="_blank">
                            ${player.playerName}
                        </a>
                    </td>
                    <td class="py-4 px-4">${player.wins}</td>
                    <td class="py-4 px-4">${player.totalHands}</td>
                    <td class="py-4 px-4">${player.winRate}%</td>
                    <td class="py-4 px-4 ${player.totalProfit >= 0 ? 'text-green-400' : 'text-red-400'}">${player.totalProfit >= 0 ? '+' : ''}${player.totalProfit.toFixed(2)}</td>
                `;
                
                leaderboardTableBody.appendChild(row);
            });
        }
    </script>
</body>
</html>
