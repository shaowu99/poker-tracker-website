<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase连接测试</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 min-h-screen text-gray-100">
    <div class="container mx-auto px-4 py-12 max-w-2xl">
        <div class="bg-gray-800 rounded-2xl shadow-2xl p-8 border border-gray-700">
            <h1 class="text-3xl font-bold mb-6 text-center">Supabase连接测试</h1>
            
            <div id="testResult" class="mb-6 p-4 rounded-lg"></div>
            
            <div class="flex justify-center">
                <button 
                    id="testButton"
                    class="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors"
                    onclick="testConnection()"
                >
                    测试连接
                </button>
            </div>
        </div>
    </div>

    <script src="lib/supabase.js"></script>
    <script src="js/supabase-client.js"></script>
    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('testResult');
            resultDiv.innerHTML = '<p class="text-yellow-400">正在测试连接...</p>';
            
            try {
                // 等待Supabase初始化
                await window.supabaseClient.ensureSupabase();
                
                // 执行连接测试
                const success = await window.supabaseClient.testConnection();
                
                if (success) {
                    resultDiv.innerHTML = '<p class="text-green-400">✅ 连接成功！Supabase客户端正常工作。</p>';
                } else {
                    resultDiv.innerHTML = '<p class="text-red-400">❌ 连接失败！请检查配置。</p>';
                }
            } catch (error) {
                console.error('连接测试错误:', error);
                resultDiv.innerHTML = `<p class="text-red-400">❌ 连接错误: ${error.message}</p>`;
            }
        }
        
        // 页面加载完成后自动初始化Supabase
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await window.supabaseClient.ensureSupabase();
                console.log('Supabase已准备就绪');
            } catch (error) {
                console.error('Supabase初始化失败:', error);
            }
        });
    </script>
</body>
</html>
